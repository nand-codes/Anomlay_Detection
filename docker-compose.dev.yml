# Local Redpanda (Kafka API) + Console for Step 1 data simulation.
# Host clients: localhost:19092
# Compose network clients: redpanda-0:9092
# Console UI: http://localhost:8080

name: netintel-dev

networks:
  redpanda_network:
    driver: bridge

volumes:
  redpanda-0: null
  timescaledb-data: null

services:
  redpanda-0:
    image: docker.redpanda.com/redpandadata/redpanda:${REDPANDA_VERSION:-v26.2.1}
    container_name: redpanda-0
    command:
      - redpanda
      - start
      - --kafka-addr
      - internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr
      - internal://redpanda-0:9092,external://localhost:19092
      - --pandaproxy-addr
      - internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr
      - internal://redpanda-0:8082,external://localhost:18082
      - --schema-registry-addr
      - internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr
      - redpanda-0:33145
      - --advertise-rpc-addr
      - redpanda-0:33145
      - --mode
      - dev-container
      - --smp
      - "1"
      - --default-log-level
      - info
    volumes:
      - redpanda-0:/var/lib/redpanda/data
    networks:
      - redpanda_network
    ports:
      - "${REDPANDA_SCHEMA_REGISTRY_PORT:-18081}:18081"
      - "${REDPANDA_PANDAPROXY_PORT:-18082}:18082"
      - "${KAFKA_EXTERNAL_PORT:-19092}:19092"
      - "${REDPANDA_ADMIN_PORT:-19644}:9644"
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -E 'Healthy:.+true' || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 10s

  console:
    image: docker.redpanda.com/redpandadata/console:${REDPANDA_CONSOLE_VERSION:-v3.9.0}
    container_name: redpanda-console
    networks:
      - redpanda_network
    entrypoint: /bin/sh
    command: -c 'echo "$$CONSOLE_CONFIG_FILE" > /tmp/config.yml; /app/console'
    environment:
      CONFIG_FILEPATH: /tmp/config.yml
      CONSOLE_CONFIG_FILE: |
        kafka:
          brokers: ["redpanda-0:9092"]
        schemaRegistry:
          enabled: true
          urls: ["http://redpanda-0:8081"]
        redpanda:
          adminApi:
            enabled: true
            urls: ["http://redpanda-0:9644"]
    ports:
      - "${REDPANDA_CONSOLE_PORT:-8080}:8080"
    depends_on:
      redpanda-0:
        condition: service_healthy

  timescaledb:
    image: timescale/timescaledb:${TIMESCALE_VERSION:-latest-pg16}
    container_name: timescaledb
    networks:
      - redpanda_network
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-netintel}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-netintel}
      POSTGRES_DB: ${POSTGRES_DB:-netintel}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - timescaledb-data:/var/lib/postgresql/data
      - ./infra/timescaledb/init.sql:/docker-entrypoint-initdb.d/01-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-netintel} -d ${POSTGRES_DB:-netintel}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  ingest-worker:
    profiles: ["ingest"]
    build:
      context: ./apps/ingest-worker
    container_name: ingest-worker
    networks:
      - redpanda_network
    environment:
      KAFKA_BOOTSTRAP: redpanda-0:9092
      KPI_TOPIC: ${KPI_TOPIC:-kpis.raw}
      CONSUMER_GROUP: ${CONSUMER_GROUP:-ingest-worker}
      DATABASE_URL: postgresql://${POSTGRES_USER:-netintel}:${POSTGRES_PASSWORD:-netintel}@timescaledb:5432/${POSTGRES_DB:-netintel}
      BATCH_SIZE: ${INGEST_BATCH_SIZE:-500}
      METRICS_PORT: 9101
    ports:
      - "${INGEST_METRICS_PORT:-9101}:9101"
    depends_on:
      redpanda-0:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  kpi-simulator:
    profiles: ["sim"]
    build:
      context: ./apps/kpi-simulator
    container_name: kpi-simulator
    networks:
      - redpanda_network
    environment:
      KAFKA_BOOTSTRAP: redpanda-0:9092
      KPI_TOPIC: ${KPI_TOPIC:-kpis.raw}
      INTERVAL_SEC: ${INTERVAL_SEC:-900}
      ALIGN_TO_BOUNDARY: ${ALIGN_TO_BOUNDARY:-true}
      FAULT_INJECTION_RATE: ${FAULT_INJECTION_RATE:-0.05}
      METRICS_PORT: 9100
    ports:
      - "${KPI_SIMULATOR_METRICS_PORT:-9100}:9100"
    depends_on:
      redpanda-0:
        condition: service_healthy
    restart: unless-stopped

  dashboard:
    build:
      context: ./apps/dashboard
    container_name: netintel-dashboard
    networks:
      - redpanda_network
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-netintel}:${POSTGRES_PASSWORD:-netintel}@timescaledb:5432/${POSTGRES_DB:-netintel}
      KAFKA_BOOTSTRAP: redpanda-0:9092
      REDPANDA_ADMIN_URL: http://redpanda-0:9644
      KPI_TOPIC: ${KPI_TOPIC:-kpis.raw}
      PORT: 8088
    ports:
      - "${DASHBOARD_PORT:-8088}:8088"
    depends_on:
      redpanda-0:
        condition: service_healthy
      timescaledb:
        condition: service_healthy
    restart: unless-stopped

  forecast-service:
    profiles: ["forecast"]
    build:
      context: ./apps/forecast-service
    container_name: forecast-service
    networks:
      - redpanda_network
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-netintel}:${POSTGRES_PASSWORD:-netintel}@timescaledb:5432/${POSTGRES_DB:-netintel}
      INTERVAL_SEC: ${INTERVAL_SEC:-900}
      FORECAST_HORIZON_HOURS: ${FORECAST_HORIZON_HOURS:-4}
      FORECAST_MIN_HISTORY_POINTS: ${FORECAST_MIN_HISTORY_POINTS:-48}
      FORECAST_MODEL: ${FORECAST_MODEL:-ets}
      RUN_ONCE: "false"
      METRICS_PORT: 9102
    ports:
      - "${FORECAST_METRICS_PORT:-9102}:9102"
    depends_on:
      timescaledb:
        condition: service_healthy
    restart: unless-stopped
