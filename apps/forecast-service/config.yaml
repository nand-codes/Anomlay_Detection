database_url: postgresql://netintel:netintel@localhost:5432/netintel

interval_sec: 900
forecast_horizon_hours: 4
forecast_min_history_points: 48
forecast_model: ets
forecast_history_limit: 672

sites:
  - siteA
  - siteB
  - siteC

metrics:
  - latency_ms
  - packet_loss_pct
  - cpu_pct
  - interface_util_pct
  - error_rate

metrics_port: 9102
run_once: false
